name: msg_gestion
description: "MSG Gestion — Mouvement Garde Suisse, Notre-Dame de Lourdes de Yapoma."
publish_to: 'none'
version: 0.1.0+19

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Plus Jakarta Sans shipped with the app (OFL, see OFL.txt): the same
  # letters offline on first launch, and in tests.
  assets:
    - assets/google_fonts/
