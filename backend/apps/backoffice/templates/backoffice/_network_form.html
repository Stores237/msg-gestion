<form method="post" style="display:flex;flex-direction:column;gap:12px">{% csrf_token %}<input type="hidden" name="action" value="network">{% if n %}<input type="hidden" name="id" value="{{ n.pk }}">{% endif %}
  <h3>{% if n %}Modifier · {{ n.name }}{% else %}Nouveau réseau{% endif %}</h3>
  <label class="fld"><span class="fld-l">Nom du réseau<em> *</em></span><span class="fld-box"><input name="name" required maxlength="120" value="{{ n.name|default:'' }}" placeholder="Ex. Mouvement Garde Suisse · Cameroun"></span></label>
  <label class="fld"><span class="fld-l">Niveau 1 (groupe de base)<em> *</em></span><span class="fld-box"><input name="level1" required maxlength="40" value="{{ n.level1|default:'' }}" placeholder="Ex. Paroisse"></span></label>
  <label class="fld"><span class="fld-l">Niveau 2<em> *</em></span><span class="fld-box"><input name="level2" required maxlength="40" value="{{ n.level2|default:'' }}" placeholder="Ex. Zone paroissiale"></span></label>
  <label class="fld"><span class="fld-l">Niveau 3</span><span class="fld-box"><input name="level3" maxlength="40" value="{{ n.level3|default:'' }}" placeholder="Ex. Diocèse"></span></label>
  <label class="fld"><span class="fld-l">Niveau 4</span><span class="fld-box"><input name="level4" maxlength="40" value="{{ n.level4|default:'' }}" placeholder="Ex. National"></span></label>
  <div class="acts" style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn btn-secondary" onclick="this.closest('dialog').close()">Annuler</button><button class="btn btn-primary">Enregistrer</button></div>
</form>
