{# Period of the figures and exports (owner, 2026-11-03). Keeps the other filters. #}
<form class="filters" method="get" aria-label="Période" style="flex-wrap:wrap;gap:8px;align-items:center">
  {% for k, v in keep %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
  <span style="font-weight:700">Période</span>
  {% for label, a, b in quick %}<a class="fsel{% if a == period.start|date:'Y-m-d' and b == period.end|date:'Y-m-d' %} on{% endif %}" href="?{% for k, v in keep %}{{ k }}={{ v|urlencode }}&{% endfor %}{% if a %}from={{ a }}&to={{ b }}{% endif %}">{{ label }}</a>{% endfor %}
  <label class="fld-box" style="min-height:40px">du <input type="date" name="from" value="{{ period.start|date:'Y-m-d' }}" aria-label="Du"></label>
  <label class="fld-box" style="min-height:40px">au <input type="date" name="to" value="{{ period.end|date:'Y-m-d' }}" aria-label="Au"></label>
  <button class="btn btn-secondary btn-sm">Appliquer</button>
  {% if period %}<span class="muted" style="font-size:13px">Chiffres et exports {{ period.label }}.</span>{% endif %}
</form>
